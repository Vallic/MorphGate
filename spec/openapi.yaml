openapi: 3.1.0
info:
  title: vault-sync
  version: 1.0.0-draft
  summary: Zero-knowledge sync protocol for MorphGate vaults.
  description: |
    Any server implementing this contract is a valid sync backend for the MorphGate client.
    The server only ever stores ciphertext (envelopes) and wrapped keys; it never
    receives the master password or any plaintext item data.

    Cryptographic formats are defined in docs/sync-crypto-spec.md ("Wire formats").

    Conventions:
      - All binary values (envelopes, wrapped keys, salts, public keys) are base64url without padding.
      - IDs are ULIDs generated by the client unless stated otherwise.
      - `rev` is a server-assigned, strictly increasing integer per vault.
      - Billing is out of scope. Hosted servers may return 402 on push; self-hosted servers need not.
      - Sharing (organizations, members, shared vaults) is optional, behind `features.sharing`;
        its crypto (certificates, grant signatures, fingerprints) is in the spec's "Sharing" section.
      - Blobs (encrypted session logs and attachments) are optional, behind `features.blobs`; their
        format is in the spec's "Blobs and session logs" section.
      - Single sign-on per organization is optional, behind `features.sso`. It is layered on top of
        the AuthKey proof, never instead of it: vault keys still come from the master password.
      - SCIM provisioning is outside vault-sync/v1. Servers may offer SCIM 2.0 (users only) at
        `/scim/v2/{org_id}`, with a bearer token per organization.
  license:
    name: CC0-1.0
    identifier: CC0-1.0
servers:
  - url: https://morphgate.com/v1
    description: Hosted
  - url: https://{host}/v1
    description: Self-hosted
    variables:
      host:
        default: localhost:8443

security:
  - bearer: []

tags:
  - name: discovery
  - name: auth
  - name: account
  - name: devices
  - name: vaults
  - name: sync
  - name: organizations
  - name: blobs
  - name: sso

paths:
  /.well-known/vault-sync:
    servers:
      - url: https://{host}
        variables:
          host:
            default: morphgate.com
    get:
      tags: [discovery]
      operationId: getCapabilities
      summary: Server capabilities and limits.
      security: []
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }

  /auth/prelogin:
    post:
      tags: [auth]
      operationId: prelogin
      summary: Return KDF parameters for an email.
      description: |
        MUST return deterministic, plausible parameters for unknown emails
        (e.g. salt = HMAC(server_secret, email)) to prevent account enumeration.
        Clients MUST refuse parameters below the floors in KdfParams.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: KDF parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KdfParams' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register/start:
    post:
      tags: [auth]
      operationId: startRegistration
      summary: Mail a sign-up code. Only if capabilities.features.email_verification.
      description: |
        Mails a 6-digit code to `email`, which `register` then needs as `email_code`. An address
        that already has an account gets a notice instead of a code; the response is the same
        either way, so it reveals nothing. Servers SHOULD send at most one mail per address per
        minute, let a code live 15 minutes and spend it after 5 wrong guesses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted; a mail may be on its way. }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '501':
          description: The server doesn't verify addresses (`not_supported`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account. Only if capabilities.features.registration_open.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created; returns session tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: |
            Malformed, or with `email_verification` a missing (`email_code_required`) or wrong or
            expired (`invalid_code`) code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Prove knowledge of AuthKey and obtain tokens plus wrapped account keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Wrong AuthKey (`invalid_credentials`), or wrong TOTP code (`invalid_totp`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '428':
          description: Second factor required (`totp_required`); retry with `totp`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate refresh token. Reuse of an old refresh token MUST revoke the device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401':
          description: >-
            `device_revoked`: the account signed this device out (`DELETE /devices/{device_id}`,
            from another device or an account page). Servers MUST answer it for as long as the
            device's refresh token would have lasted, so a device that was offline learns it too;
            the client then forgets what it keeps from the account (its vaults, keys, settings).
            `account_deleted`: the account was deleted (from another of its devices or a website);
            servers MUST answer it for its refresh tokens' remaining lifetime (still
            `device_revoked` for a device signed out before the deletion). The client turns
            sync off, keeps its personal vault (now the only copy) and drops team vaults. Any other
            401 (`invalid_credentials`: an expired session, a reused token, a changed password)
            only means "sign in again": the client keeps its data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current device's tokens.
      responses:
        '204': { description: Logged out }

  /account:
    get:
      tags: [account]
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Permanently delete account, vaults and items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_key]
              properties:
                auth_key: { $ref: '#/components/schemas/B64' }
      responses:
        '204': { description: "Deleted, with every token." }
        '401': { $ref: '#/components/responses/Error' }
        '409':
          description: '`sole_owner`: the account owns an organization; transfer or delete it first.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`billing_unavailable` (hosted): the subscription could not be cancelled, so nothing was deleted; try again later.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /account/terms:
    put:
      tags: [account]
      operationId: acceptTerms
      summary: Accept the current terms (capabilities.features.terms), after they changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted_terms]
              properties:
                accepted_terms: { type: string, description: The version from capabilities.features.terms. }
      responses:
        '204': { description: Accepted }
        '400': { $ref: '#/components/responses/Error' }
        '404': { description: The server asks no terms to be accepted. }

  /account/export:
    get:
      tags: [account]
      operationId: exportAccount
      summary: Everything the server keeps about the account, readable (access and portability).
      description: |
        Format `morphgate-account-export/1`: `format`, `generated_at`, `about`, then the sections
        the server has: `account` (id, email, created_at, two_step_verification, public_keys),
        `devices` (signed-out ones included, with `signed_out`), `entitlement`, `organizations`
        (memberships), `vaults` (`personal` with item and blob counts; `organization` with
        `permission`), `invites` (unexpired, to the account's address), `sso_sessions`,
        `activity` (organization events by or about the account) and server-specific ones
        (`provisioning`, `billing`). Null values are left out. Never secrets, hashes, wrapped
        keys or vault contents: those are end-to-end encrypted, so apps export them. Requires a
        full session. Optional: servers without it answer 404.
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                type: object
                required: [format, generated_at, account]
                properties:
                  format: { type: string, enum: [morphgate-account-export/1] }
                  generated_at: { type: string, format: date-time }
                  about: { type: string }
                  account: { type: object }
                  devices: { type: array, items: { type: object } }
                  entitlement: { type: object }
                  organizations: { type: array, items: { type: object } }
                  vaults: { type: object }
                  invites: { type: array, items: { type: object } }
                  sso_sessions: { type: array, items: { type: object } }
                  activity: { type: array, items: { type: object } }
                additionalProperties: true
        '404': { description: The server has no export }

  /account/keys:
    put:
      tags: [account]
      operationId: rotateAccountCredentials
      summary: Change password or recovery key by re-wrapping account private keys.
      description: |
        Items are not re-encrypted. When the password changes (`new_auth_key` differs from the
        current one), the server MUST end the sessions of every other device; they sign in again
        with the new password. Replacing only the recovery key keeps everyone signed in.
        With a `recover`-scoped token (see POST /account/recover) no `current_auth_key` is
        needed, every session ends, and the token itself is spent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateCredentialsRequest' }
      responses:
        '204': { description: Updated }
        '401': { $ref: '#/components/responses/Error' }

  /account/recover:
    post:
      tags: [account]
      operationId: recover
      summary: Fetch account keys wrapped under the recovery key.
      description: |
        Returns `wrapped_private_keys_rk`. The client unwraps with RK, then calls
        PUT /account/keys with the returned access token instead of `current_auth_key`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, recovery_proof]
              properties:
                email: { type: string, format: email }
                recovery_proof:
                  $ref: '#/components/schemas/B64'
                  description: HKDF(RK, "morphgate/v1/recovery-auth"); server stores only its hash.
      responses:
        '200':
          description: |
            Recovery material and a short-lived access token (no refresh token) that is only
            accepted, once, by PUT /account/keys.
          content:
            application/json:
              schema:
                type: object
                required: [wrapped_private_keys_rk, access_token]
                properties:
                  wrapped_private_keys_rk: { $ref: '#/components/schemas/B64' }
                  access_token: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /account/email/start:
    post:
      tags: [account]
      operationId: startEmailChange
      summary: Mail a code to a new address. Only if capabilities.features.email_verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
      responses:
        '202': { description: Accepted; a mail may be on its way. }
        '409': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }

  /account/email:
    put:
      tags: [account]
      operationId: changeEmail
      summary: Move the account to the new address with its code.
      description: |
        The KDF salt is stored per account, not derived from the address, so nothing is
        re-derived. Servers SHOULD notify the old address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, code, auth_key]
              properties:
                new_email: { type: string, format: email }
                code: { type: string, pattern: '^[0-9]{6}$' }
                auth_key: { $ref: '#/components/schemas/B64' }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /account/totp/start:
    post:
      tags: [account]
      operationId: startTotp
      summary: A new authenticator secret. Only if capabilities.features.totp.
      description: |
        Nothing changes until POST /account/totp/enable gets a code from it. While TOTP is on,
        this answers `409 totp_enabled`: turn it off first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_key]
              properties:
                auth_key: { $ref: '#/components/schemas/B64' }
      responses:
        '200':
          description: The pending secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /account/totp/enable:
    post:
      tags: [account]
      operationId: enableTotp
      summary: Turn TOTP on with a code from the pending secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Two-step verification is on }
        '400': { $ref: '#/components/responses/Error' }

  /account/totp:
    delete:
      tags: [account]
      operationId: disableTotp
      summary: Turn TOTP off.
      description: |
        Each code is accepted once, here and at login. Account recovery (POST /account/recover
        followed by PUT /account/keys) also turns TOTP off: the recovery key is the way back from
        losing the authenticator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_key, code]
              properties:
                auth_key: { $ref: '#/components/schemas/B64' }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: Two-step verification is off }
        '401': { $ref: '#/components/responses/Error' }

  /account/web-session:
    post:
      tags: [account]
      operationId: webSession
      summary: Hosted only (capabilities.features.billing.web_session). A link into the account portal.
      description: |
        A single-use URL, valid for `expires_in` seconds, that signs the account in to the
        server's web portal (plan, billing, devices). The portal never handles vault data.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                next:
                  type: string
                  description: >-
                    The portal page the link lands on: `/account` (the default),
                    `/account/two-step`, `/account/team/{org_id}` or `/account/team/{org_id}/{tab}`
                    (e.g. `billing`). Anything else is `400 bad_request`.
                  examples: [/account/team/01J0000000000000000000000/billing]
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSession' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: >-
        A device says what it is now: its name, platform and client version, which it otherwise
        sends only when it signs in (an app update, a renamed computer). Only the calling device's
        own: another's is `403 not_permitted`. Clients send it once in a while (once a run, say)
        and ignore a `404` or `405` from servers without it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: >-
        Sign a device out. Its next refresh gets `401 device_revoked` (see `/auth/refresh`), and
        it clears itself.
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }

  /vaults:
    get:
      tags: [vaults]
      operationId: listVaults
      responses:
        '200':
          description: Vaults the account can access, with wrapped vault keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vault' }
    post:
      tags: [vaults]
      operationId: createVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, wrapped_vault_key, key_id]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                key_id: { $ref: '#/components/schemas/B64' }
                wrapped_vault_key:
                  $ref: '#/components/schemas/B64'
                  description: Sealed box of VK to the account X25519 public key.
                meta:
                  $ref: '#/components/schemas/B64'
                  description: |
                    Vault name and settings: an envelope with item id `vault-meta`, sealed with the
                    vault key and signed by the creator.
                org_id:
                  $ref: '#/components/schemas/Ulid'
                  description: |
                    `sharing`: create the vault in this organization. Owners and admins may; members
                    when the `members_can_create_vaults` policy allows (they then get `manage`).
                keys:
                  type: array
                  description: |
                    `sharing`, organization vaults: the key sealed to every owner and admin, the caller
                    included (its entry repeats `wrapped_vault_key`). Missing anyone: 400 incomplete_keys.
                  items: { $ref: '#/components/schemas/SealedFor' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '409': { $ref: '#/components/responses/Error' }

  /vaults/{vault_id}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getVault
      responses:
        '200':
          description: Vault
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [vaults]
      operationId: deleteVault
      description: The owner of a personal vault; an organization's owners and admins for its vaults.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }

  /vaults/{vault_id}/changes:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Items (including tombstones) with rev > since, ordered by rev ascending.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Page of changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
        '410':
          description: |
            `since` predates the oldest retained tombstone. Client MUST discard
            local sync state and resync from `since=0`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [sync]
      operationId: pushChanges
      summary: Push a batch. Each item is accepted or rejected independently.
      description: |
        An item is accepted iff it does not exist on the server or its current
        `rev` equals the submitted `base_rev`. Accepted items receive a new `rev`.
        Rejected items return the server's current copy for client-side merge.

        On `sharing` servers the server records the caller as the revision's `author_id`, and
        rejects an item whose envelope header names a key generation other than the vault's
        current one (`stale_key`): the client re-encrypts it and pushes again. A member with `read`
        access gets 403 not_permitted for the whole request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Per-item results. Partial acceptance is normal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
        '402':
          description: >-
            Hosted only. The plan doesn't cover pushing here; pulls remain allowed. An organization
            vault follows the organization's plan, not the member's.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      reason: { enum: [trial_ended, lapsed] }
                      billing_url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }

  /vaults/{vault_id}/members:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [organizations]
      operationId: listVaultMembers
      description: Who can open the vault. Needs `manage`.
      responses:
        '200':
          description: Owners and admins (implicit), then granted members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultMember' }

  /vaults/{vault_id}/members/{account_id}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/AccountId'
    put:
      tags: [organizations]
      operationId: setVaultMember
      description: |
        Grants a confirmed member access to an organization vault, or changes their permission.
        Granting needs `keys`: the current key generation (and any older ones still in use) sealed
        to the member. Needs `manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetVaultMember' }
      responses:
        '200':
          description: The member's access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultMember' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [organizations]
      operationId: revokeVaultMember
      description: Revokes a granted member. The vault gets `rotation_due`. Needs `manage`.
      responses:
        '204': { description: Revoked }

  /vaults/{vault_id}/keys:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [organizations]
      operationId: rotateVaultKey
      description: |
        Switches the vault to a new key generation, sealed to every account with access (owners and
        admins included). `previous_key_id` must be the current generation (else 409 conflict); a
        missing account is 400 incomplete_rotation. Clears `rotation_due`. Older generations stay in
        the ring while items use them (`items_on_old_keys`). Needs `manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateVaultKey' }
      responses:
        '200':
          description: The vault after the switch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vault' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /orgs:
    get:
      tags: [organizations]
      operationId: listOrgs
      responses:
        '200':
          description: Organizations the caller belongs to (accepted or confirmed).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrgMembership' }
    post:
      tags: [organizations]
      operationId: createOrg
      description: The caller becomes the owner and the root of the ownership chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { $ref: '#/components/schemas/Ulid' }
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '402':
          description: >-
            Hosted only. `team_limit`: the caller owns `limit` organizations without a paid plan
            (trials count as unpaid); one needs a plan, or has to go, before another.
            `billing_url` is the account page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: getOrg
      description: Any member. Non-members get 404.
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [organizations]
      operationId: updateOrg
      description: Name and policies. Owners and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                policies: { $ref: '#/components/schemas/Policies' }
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '501':
          description: A policy the server can't enforce (e.g. require_totp without TOTP).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [organizations]
      operationId: deleteOrg
      description: The owner, proving their AuthKey. Deletes the organization's vaults and items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_key]
              properties:
                auth_key: { $ref: '#/components/schemas/B64' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: listMembers
      description: Confirmed members only. Apps check every member's keys against the certificate chain.
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members/{account_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    patch:
      tags: [organizations]
      operationId: updateMember
      description: |
        The owner changes a confirmed member's role. Promoting to admin needs `admin_cert` and every
        organization vault key the member lacks (400 incomplete_keys). Demoting takes away the keys
        of vaults not granted to them and sets `rotation_due` there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMember' }
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
    delete:
      tags: [organizations]
      operationId: removeMember
      description: |
        Admins remove members, the owner removes admins, and anyone may remove themselves (leave).
        The owner can't leave (409 sole_owner). Every vault the member could open gets `rotation_due`.
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members/{account_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [organizations]
      operationId: confirmMember
      description: |
        An admin confirms an accepted member: a member certificate over their keys (after comparing
        fingerprints out of band) and the keys of the vaults the invite granted, sealed to them.
        Confirming an admin is the owner's: it also needs `admin_cert` and every organization vault key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMember' }
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Error' }
        '402':
          description: Hosted only. The confirm would pass the seat count (seats_exceeded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orgs/{org_id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: listInvites
      description: Pending invites (tokens are never shown again). Owners and admins.
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invite' }
    post:
      tags: [organizations]
      operationId: createInvite
      description: |
        Owners and admins invite members; only the owner invites admins. Invites are single use,
        bound to the address, valid 7 days; a new invite to the same address replaces the old one.
        Policy `allowed_email_domains` applies (403 not_permitted).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvite' }
      responses:
        '201':
          description: Created; `token` is present when the server doesn't mail invites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/InviteId'
    delete:
      tags: [organizations]
      operationId: cancelInvite
      responses:
        '204': { description: Cancelled }

  /orgs/{org_id}/transfer:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [organizations]
      operationId: transferOrg
      description: |
        The owner hands the organization to a confirmed admin, proving their AuthKey and signing an
        owner certificate (appended to the ownership chain). The old owner becomes an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOrg' }
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }

  /orgs/{org_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: orgEvents
      description: The audit log, oldest first. Owners and admins.
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Events with seq > since
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }

  /orgs/{org_id}/events/export:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: exportOrgEvents
      description: |
        The whole audit log as a download (owners and admins): CSV (`format=csv`, the default;
        columns seq, at, kind, actor_id, actor_email, target_id, target_email, vault_id, detail;
        cells a spreadsheet would run as formulas are prefixed with `'`) or JSON lines
        (`format=jsonl`, one event per line with `org_id`). Optional (the hosted
        backend and the reference server have it); others answer 404.
      parameters:
        - { name: format, in: query, schema: { enum: [csv, jsonl], default: csv } }
      responses:
        '200':
          description: The log, as an attachment (`Content-Disposition`)
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members/{account_id}/certificate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: account_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [organizations]
      operationId: recertifyMember
      description: |
        Owners and admins certify a confirmed member again (a `member` certificate over their
        keys, by the caller). A member certificate verifies only while its signer is an owner or
        an admin, so when the admin who confirmed someone leaves or is made a member, devices
        that never verified that person can no longer trust them. Apps of owners and admins
        re-sign the members they verified before; others compare fingerprints first. 409 when
        the member isn't confirmed. Audited as `member_recertified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_cert]
              properties:
                member_cert: { $ref: '#/components/schemas/B64' }
      responses:
        '200':
          description: The member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/devices:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [organizations]
      operationId: orgDeviceRequests
      description: |
        Device approval (`policies.require_device_approval`): devices' requests to open the
        organization's vaults, newest first. Owners and admins see everyone's, members their own.
        A device files its request the first time it asks for one of the vaults (including by
        listing vaults, which leaves out the ones that wait); that is how a new device learns it
        waits: its own request is listed here.
      parameters:
        - { name: status, in: query, schema: { enum: [pending, approved, denied] } }
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceApproval' }
        '404': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members/{account_id}/devices/{device_id}/approve:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: account_id, in: path, required: true, schema: { type: string } }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [organizations]
      operationId: approveDevice
      description: |
        Approves a member's device (no body). Owners and admins decide for anyone; members for
        their own other devices (403 not_permitted otherwise). A device never decides for itself,
        and while the policy is on the deciding device must be approved itself. 404 when the
        device never asked. Audited as `device_approved`.
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceApproval' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/members/{account_id}/devices/{device_id}/deny:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: account_id, in: path, required: true, schema: { type: string } }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [organizations]
      operationId: denyDevice
      description: Like approve, the other way (audited as `device_denied`). A denied device can be approved later.
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceApproval' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /invites/{token}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [organizations]
      operationId: inviteInfo
      security: []
      description: What the invite is for, and the ownership chain the invitee pins.
      responses:
        '200':
          description: Invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteInfo' }
        '410':
          description: invite_expired (used, cancelled or older than 7 days)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /invites/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [organizations]
      operationId: acceptInvite
      description: |
        The account with the invited address joins as `accepted`; an admin confirms it. Another
        address: 403 invite_email_mismatch.
      responses:
        '200':
          description: The new membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMembership' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /vaults/{vault_id}/blobs:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [blobs]
      operationId: listBlobs
      description: Optional (features.blobs). The vault's blobs, oldest first. Needs read access.
      parameters:
        - name: kind
          in: query
          schema: { enum: [attachment, session_log] }
      responses:
        '200':
          description: Blobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlobInfo' }
        '404': { $ref: '#/components/responses/Error' }

  /vaults/{vault_id}/blobs/{hash}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/BlobHash'
    put:
      tags: [blobs]
      operationId: putBlob
      description: |
        Stores a blob: the body is its bytes (sealed by the client), named by their SHA-256. Needs
        write access. Checked in this order: the kind (400 bad_request), a plan feature where plans
        apply (402 upgrade_required, `feature: session_logs`, for a session log in an organization
        vault), the name (400 bad_request), the size (413 too_large, see
        `features.blobs.max_blob_bytes`), the hash of the bytes (400 hash_mismatch), then the quota
        shared by the vault's owner (413 quota_exceeded). The same bytes again change nothing.
      parameters:
        - name: X-Blob-Kind
          in: header
          schema: { enum: [attachment, session_log], default: attachment }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlobInfo' }
        '200':
          description: Already stored (the same bytes); nothing changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlobInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
    get:
      tags: [blobs]
      operationId: getBlob
      description: The bytes (HEAD for the headers only). Needs read access.
      responses:
        '200':
          description: The blob
          headers:
            ETag: { schema: { type: string }, description: "The hash, quoted" }
            X-Blob-Kind: { schema: { enum: [attachment, session_log] } }
            Cache-Control: { schema: { const: no-store } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [blobs]
      operationId: deleteBlob
      description: >-
        Needs write access. Servers can't tell which items refer to a blob, so clients delete the
        ones they no longer need.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/sso:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [sso]
      operationId: getSso
      description: Optional (features.sso). The organization's identity provider and this device's session. Any member.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoStatus' }
        '404': { $ref: '#/components/responses/Error' }

  /orgs/{org_id}/sso/start:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [sso]
      operationId: startSso
      description: |
        Starts a sign-in at the organization's identity provider for this device (confirmed
        members). The app opens `url` in a browser; the provider sends the browser back to the
        server, which records a session for (organization, account, device) and shows "return to
        MorphGate". The app then retries what answered 403 sso_required. The sign-in must finish
        within `expires_in` seconds (else 400 sso_expired); a token that fails the provider's checks
        is 401 sso_invalid_token, an address that isn't the account's is 403 sso_mismatch, and an
        unreachable provider is 502 sso_provider_error.
      responses:
        '200':
          description: Where to sign in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoStart' }
        '403': { $ref: '#/components/responses/Error' }
        '409':
          description: sso_not_configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vaults/{vault_id}/events:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [sync]
      operationId: streamEvents
      summary: Optional (capabilities.features.sse). Server-sent head revision nudges.
      responses:
        '200':
          description: |
            text/event-stream. Each event: `event: head` / `data: {"head_rev": 1842}`.
            Clients respond by calling pullChanges.
          content:
            text/event-stream:
              schema: { type: string }
        '501': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    VaultId:
      name: vault_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    OrgId:
      name: org_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: invite_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string, description: "32 random bytes, base64url" }
    BlobHash:
      name: hash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{64}$', description: Lowercase hex SHA-256 of the blob's bytes }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    B64:
      type: string
      contentEncoding: base64url
      pattern: '^[A-Za-z0-9_-]*$'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_credentials, totp_required, invalid_totp, totp_enabled, email_code_required, invalid_code, not_supported, conflict, gone, payment_required, too_large,
                     not_permitted, invite_email_mismatch, invite_expired, already_member, sole_owner, incomplete_keys, incomplete_rotation, stale_key, org_exists, vault_exists,
                     seats_exceeded, team_limit, terms_not_accepted, billing_unavailable, totp_setup_required, hash_mismatch, quota_exceeded, upgrade_required, sso_required, sso_not_configured,
                     sso_expired, sso_invalid_token, sso_mismatch, sso_provider_error, device_approval_required, device_revoked, account_deleted]
        message: { type: string }
        org_id:
          type: string
          description: >-
            With 403 sso_required, the organization whose identity provider the device must sign
            in at; with 403 device_approval_required, the organization that has to approve it.
        device_id:
          type: string
          description: With 403 device_approval_required, the calling device.
        status:
          enum: [pending, denied]
          description: >-
            With 403 device_approval_required: `pending` (the request is filed; retry later) or
            `denied`. Checked after totp_setup_required and sso_required.
        plan:
          type: string
          description: With 402 upgrade_required, the plan that has the feature (e.g. `business`).
        feature:
          type: string
          description: With 402 upgrade_required, the missing feature (`sso`, `scim`, `session_logs`, `audit_stream`, `device_approval`).
        billing_url:
          type: string
          format: uri
          description: With 402, where the owner can change the plan.
        limit:
          type: integer
          description: With 402 team_limit, how many organizations an account may own without a paid plan.
        terms:
          $ref: '#/components/schemas/Terms'
          description: With 400 terms_not_accepted, the terms to accept.

    Capabilities:
      type: object
      required: [spec, versions, limits, features]
      properties:
        spec: { const: vault-sync }
        versions:
          type: array
          items: { type: string }
          examples: [[v1]]
        server:
          type: object
          properties:
            name: { type: string, examples: [vault-sync-reference] }
            version: { type: string }
        limits:
          type: object
          required: [max_envelope_bytes, max_push_items, max_items_per_vault, tombstone_retention_days]
          properties:
            max_envelope_bytes: { type: integer, default: 65536 }
            max_push_items: { type: integer, default: 500 }
            max_items_per_vault: { type: integer }
            tombstone_retention_days: { type: integer, minimum: 30, default: 90 }
        features:
          type: object
          properties:
            registration_open: { type: boolean }
            terms:
              $ref: '#/components/schemas/Terms'
              description: >-
                New accounts accept these (`accepted_terms` on register); absent when the server
                asks for none. An account whose `terms.version` differs accepts the new ones with
                PUT /account/terms.
            email_verification:
              type: boolean
              description: Sign-up needs the code from POST /auth/register/start; email changes are available.
            sse: { type: boolean }
            totp: { type: boolean }
            signed_tombstones:
              type: boolean
              description: >-
                The server keeps the envelope a deletion carries (its author's signed deletion,
                at most 1024 bytes) for an item it has, and returns it with the tombstone. Servers
                without it ignore that envelope; clients send it either way.
            blobs:
              type: object
              description: Encrypted session logs and attachments (the paths under /vaults/{vault_id}/blobs).
              required: [max_blob_bytes, quota_bytes, kinds]
              properties:
                max_blob_bytes: { type: integer, examples: [26214400] }
                quota_bytes:
                  type: integer
                  description: Shared by everything one owner has (an account's personal vaults, or an organization's vaults).
                  examples: [1073741824]
                kinds:
                  type: array
                  items: { enum: [attachment, session_log] }
            sso:
              type: object
              description: >-
                Organizations can put their vaults behind their identity provider (configured on
                the server's website; hosted: the Business plan). Vaults then answer 403
                sso_required until the device signs in (POST /orgs/{org_id}/sso/start).
              properties:
                protocols:
                  type: array
                  items: { enum: [oidc, saml] }
            sharing:
              type: object
              description: Organizations, members and shared vaults (the paths under /orgs and /invites).
              properties:
                max_members_per_org: { type: integer, description: 0 = no limit }
                max_vaults_per_org: { type: integer, description: 0 = no limit }
                mails_invites:
                  type: boolean
                  description: The server emails invite links. Otherwise POST /orgs/{org_id}/invites returns the token for the admin to pass on.
            billing:
              type: object
              description: Hosted only. Absent on self-hosted servers.
              properties:
                portal_url: { type: string, format: uri }
                web_session:
                  type: boolean
                  description: POST /account/web-session hands out portal links.
                plans_enforced:
                  type: boolean
                  description: >-
                    Vaults without a usable plan refuse pushes (402); apps say so where a plan is
                    missing. Absent or false: plans are shown, and nothing is held back.

    KdfParams:
      type: object
      description: Argon2id parameters. Clients reject m_kib < 65536, t < 2, salt < 16 bytes.
      required: [alg, m_kib, t, p, salt]
      properties:
        alg: { const: argon2id }
        m_kib: { type: integer, minimum: 65536, examples: [262144] }
        t: { type: integer, minimum: 2, examples: [3] }
        p: { type: integer, minimum: 1, maximum: 16, examples: [1] }
        salt: { $ref: '#/components/schemas/B64' }

    DeviceInfo:
      type: object
      required: [id, name, platform, public_key]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, maxLength: 100 }
        platform: { enum: [linux, macos, windows, ios, android] }
        client_version: { type: string }
        public_key:
          $ref: '#/components/schemas/B64'
          description: Device Ed25519 public key.

    DeviceUpdate:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        platform: { enum: [linux, macos, windows, ios, android] }
        client_version: { type: string, maxLength: 64 }

    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceInfo'
        - type: object
          required: [created_at]
          properties:
            created_at: { type: string, format: date-time }
            last_seen_at: { type: string, format: date-time }
            current: { type: boolean }

    AccountKeys:
      type: object
      required: [enc_public_key, sign_public_key, wrapped_private_keys]
      properties:
        enc_public_key: { $ref: '#/components/schemas/B64' }
        sign_public_key: { $ref: '#/components/schemas/B64' }
        wrapped_private_keys:
          $ref: '#/components/schemas/B64'
          description: nonce(24) || XChaCha20-Poly1305(KEK, X25519 priv || Ed25519 priv).

    RegisterRequest:
      type: object
      required: [email, kdf, auth_key, keys, recovery, device]
      properties:
        email: { type: string, format: email }
        kdf: { $ref: '#/components/schemas/KdfParams' }
        auth_key:
          $ref: '#/components/schemas/B64'
          description: HKDF(MK, "morphgate/v1/auth"). Server MUST store only a slow hash of it.
        keys: { $ref: '#/components/schemas/AccountKeys' }
        recovery:
          type: object
          required: [wrapped_private_keys_rk, recovery_proof]
          properties:
            wrapped_private_keys_rk: { $ref: '#/components/schemas/B64' }
            recovery_proof: { $ref: '#/components/schemas/B64' }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        email_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Required when capabilities.features.email_verification.
        accepted_terms:
          type: string
          description: >-
            The version of capabilities.features.terms the person accepted; required when the
            server has terms (`400 terms_not_accepted` otherwise).

    Terms:
      type: object
      required: [version, terms_url, privacy_url]
      properties:
        version: { type: string, examples: ['2026-10-17'] }
        terms_url: { type: string, format: uri }
        privacy_url: { type: string, format: uri }

    LoginRequest:
      type: object
      required: [email, auth_key, device]
      properties:
        email: { type: string, format: email }
        auth_key: { $ref: '#/components/schemas/B64' }
        totp: { type: string, pattern: '^[0-9]{6}$' }
        device: { $ref: '#/components/schemas/DeviceInfo' }

    Tokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, examples: [900] }

    Session:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [account_id, keys]
          properties:
            account_id: { $ref: '#/components/schemas/Ulid' }
            keys: { $ref: '#/components/schemas/AccountKeys' }

    Account:
      type: object
      required: [id, email, kdf, keys]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        email: { type: string, format: email }
        kdf: { $ref: '#/components/schemas/KdfParams' }
        keys: { $ref: '#/components/schemas/AccountKeys' }
        wrapped_private_keys_rk:
          $ref: '#/components/schemas/B64'
          description: Account keys under the recovery key (ciphertext), so any device can offer recovery.
        totp_enabled: { type: boolean }
        email_verified:
          type: boolean
          description: Whether the address was proven with a mailed code. Absent on servers that don't check.
        entitlement:
          $ref: '#/components/schemas/Entitlement'
          description: Hosted only. Absent on self-hosted servers.
        terms:
          type: object
          description: The terms this account accepted, if any (compare with capabilities.features.terms).
          required: [version]
          properties:
            version: { type: string }
            accepted_at: { type: string, format: date-time }

    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: 'Base32 (RFC 4648, no padding), for typing into an authenticator app.' }
        uri: { type: string, description: '`otpauth://totp/…` (SHA-1, 6 digits, 30 s), for a QR code.' }

    WebSession:
      type: object
      required: [url, expires_in]
      properties:
        url: { type: string, format: uri }
        expires_in: { type: integer, examples: [60] }

    RotateCredentialsRequest:
      type: object
      required: [new_kdf, new_auth_key, wrapped_private_keys]
      properties:
        current_auth_key: { $ref: '#/components/schemas/B64' }
        new_kdf: { $ref: '#/components/schemas/KdfParams' }
        new_auth_key: { $ref: '#/components/schemas/B64' }
        wrapped_private_keys: { $ref: '#/components/schemas/B64' }
        recovery:
          description: Supply to rotate the recovery key at the same time.
          type: object
          required: [wrapped_private_keys_rk, recovery_proof]
          properties:
            wrapped_private_keys_rk: { $ref: '#/components/schemas/B64' }
            recovery_proof: { $ref: '#/components/schemas/B64' }

    Vault:
      type: object
      required: [id, key_id, wrapped_vault_key, head_rev, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        key_id:
          $ref: '#/components/schemas/B64'
          description: 16-byte vault key generation id, as carried in every envelope.
        wrapped_vault_key: { $ref: '#/components/schemas/B64' }
        meta: { $ref: '#/components/schemas/B64' }
        head_rev: { type: integer, minimum: 0 }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }
        org_id:
          $ref: '#/components/schemas/Ulid'
          description: "`sharing`: the owning organization; absent for a personal vault."
        created_by: { type: string, description: "`sharing`: the creator, who signed `meta`." }
        permission: { $ref: '#/components/schemas/Permission' }
        keys:
          type: array
          description: "`sharing`: the caller's copy of every key generation in the ring, oldest first. `key_id` and `wrapped_vault_key` above are the current one."
          items: { $ref: '#/components/schemas/KeyGeneration' }
        rotation_due:
          type: boolean
          description: Someone lost access; an app with `manage` should rotate.
        items_on_old_keys:
          type: integer
          description: Live items under an older generation (a rotation in progress).

    Item:
      type: object
      required: [id, rev, deleted, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        rev: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        device_id: { $ref: '#/components/schemas/Ulid' }
        envelope:
          $ref: '#/components/schemas/B64'
          description: |
            version(1) || key_id(16) || nonce(24) || ciphertext || sig(64).
            When deleted = true: the deletion's envelope its author pushed (`signed_tombstones`),
            or absent.
        updated_at: { type: string, format: date-time }
        author_id:
          type: string
          description: |
            `sharing`: the account that pushed this revision, set by the server. Clients verify the
            envelope with that member's signing key. Absent = the vault's owner.

    ChangePage:
      type: object
      required: [items, head_rev, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        head_rev: { type: integer }
        has_more: { type: boolean }

    PushItem:
      type: object
      required: [id, deleted]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        base_rev:
          type: integer
          minimum: 0
          description: Omit or 0 for new items.
        deleted: { type: boolean }
        envelope:
          $ref: '#/components/schemas/B64'
          description: >-
            Required unless deleted = true. A deletion may carry its signed deletion (at most 1024
            bytes, any key generation of the vault; `too_large` beyond): a server with
            `signed_tombstones` keeps it for an item it has, others ignore it.

    PushRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/PushItem' }

    PushResult:
      type: object
      required: [id, status]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { enum: [accepted, conflict, rejected] }
        rev:
          type: integer
          description: New rev when accepted.
        current:
          $ref: '#/components/schemas/Item'
          description: Server copy when status = conflict.
        error: { $ref: '#/components/schemas/Error' }

    PushResponse:
      type: object
      required: [results, head_rev]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/PushResult' }
        head_rev: { type: integer }

    Role: { enum: [owner, admin, member] }
    Permission:
      enum: [read, write, manage]
      description: read = pull and decrypt; write = also push; manage = also grant access and rotate.
    MemberStatus: { enum: [accepted, confirmed] }

    Signed:
      type: object
      description: A signature by another account over a message from the spec's "Sharing" section.
      required: [signer_id, sig]
      properties:
        signer_id: { type: string }
        sig: { $ref: '#/components/schemas/B64' }

    OwnerLink:
      type: object
      required: [account_id, enc_public_key, sign_public_key]
      properties:
        account_id: { type: string }
        enc_public_key: { $ref: '#/components/schemas/B64' }
        sign_public_key: { $ref: '#/components/schemas/B64' }
        cert:
          $ref: '#/components/schemas/Signed'
          description: The previous owner's owner certificate; absent on the first link (the creator).

    Policies:
      type: object
      properties:
        require_totp:
          type: boolean
          description: >-
            Members without two-step verification get 403 totp_setup_required on the
            organization's vaults (pull and push) until they turn it on. Their personal vault is
            unaffected. Servers without TOTP refuse to set it (501 not_supported).
        members_can_create_vaults:
          type: boolean
          description: Members (not only owners and admins) may create vaults, which they then manage.
        allowed_email_domains:
          type: array
          items: { type: string }
          description: Invites only to addresses at these domains (403 not_permitted otherwise). Empty = any.
        session_log_retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: The server deletes the organization's session_log blobs older than this. 0 keeps them.
        require_sso:
          type: boolean
          description: >-
            With an identity provider configured, the organization's vaults answer 403
            sso_required until the device has signed in at it; no effect without one. Servers
            without single sign-on refuse to set it (501 not_supported). Clients send back the
            value they read: it is managed where the provider is.
        require_member_keys:
          type: boolean
          description: >-
            Members publish the SSH public keys they use on the organization's hosts in the
            member key directory (a vault the apps keep), so offboarding finds them; apps remind
            members who haven't. Enforced by the apps; the server only stores it. Clients send it
            only once it is set.
        require_device_approval:
          type: boolean
          description: >-
            New devices can't open the organization's vaults (403 device_approval_required) until
            an owner or admin, or the member from one of their own approved devices, approves them
            (`/orgs/{org_id}/devices`). Turning it on approves the signed-in devices of confirmed
            members; confirming a member approves their devices; signing a device out forgets its
            approvals. Plans may gate turning it on (402 upgrade_required, feature
            `device_approval`); turning it off is always allowed.

    Org:
      type: object
      required: [id, name, owner_id, owner_chain, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        owner_id: { type: string }
        owner_chain:
          type: array
          items: { $ref: '#/components/schemas/OwnerLink' }
        policies: { $ref: '#/components/schemas/Policies' }
        created_at: { type: string, format: date-time }
        entitlement:
          $ref: '#/components/schemas/Entitlement'
          description: >-
            Hosted only: the organization's plan, which its vaults follow. Absent on self-hosted
            servers. Members see it too, so their apps can explain a 402.

    Entitlement:
      type: object
      required: [plan]
      properties:
        plan: { type: string, examples: [personal, team] }
        status:
          enum: [trialing, active, grace, lapsed, canceled]
          description: A trial or subscription past `expires_at` reads as `grace`, then `lapsed`.
        expires_at: { type: string, format: date-time }
        grace_ends_at:
          type: string
          format: date-time
          description: While `grace`, until when it keeps syncing; then `lapsed`.
        seats: { type: integer, description: 'Organization plans: seats bought. Confirmed members use them.' }
        source:
          type: string
          description: >-
            Where the entitlement comes from. Apps read only `team_seat`: a personal entitlement
            in `grace` because a team seat that covered the account's personal sync ended
            (removed, left, team deleted or its plan ended) after its own trial or plan had;
            `expires_at` is when the seat ended, `team` names the team.
        team: { type: string, description: 'With `source: team_seat`: the team whose seat it was.' }
        features:
          type: array
          items: { enum: [sso, scim, session_logs, audit_stream, device_approval] }
          description: An organization's plan features; apps offer what is listed (and everything when there is no entitlement).

    DeviceApproval:
      type: object
      required: [account_id, device_id, status, requested_at]
      properties:
        account_id: { type: string }
        email: { type: string }
        device_id: { type: string }
        name: { type: string }
        platform: { type: string }
        client_version: { type: string }
        status: { enum: [pending, approved, denied] }
        requested_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string, description: The account that decided. }

    BlobInfo:
      type: object
      required: [hash, size, kind, created_at]
      properties:
        hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer }
        kind: { enum: [attachment, session_log] }
        author_id: { type: string }
        created_at: { type: string, format: date-time }

    SsoStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        required: { type: boolean, description: require_sso is on and a provider is configured }
        protocol: { enum: [oidc, saml] }
        issuer: { type: string, description: 'OIDC: the issuer URL; SAML: the entity ID' }
        session_expires_at:
          type: string
          format: date-time
          description: This device's session; absent when it has none (or it expired).

    SsoStart:
      type: object
      required: [url, expires_in]
      properties:
        url: { type: string, format: uri, description: Open in a browser }
        expires_in: { type: integer, examples: [600] }

    OrgMembership:
      type: object
      required: [id, name, role, status]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        rev:
          type: integer
          minimum: 0
          description: >-
            Optional. The organization's revision: it changes (in the same transaction) whenever
            anything a member's app fetches for it changes: `GET /orgs/{org_id}`, its members,
            its device approvals, or the members of its vaults. A client that saw this value can
            reuse what it fetched then instead of asking again. Compared for equality only.
            Servers without it leave it out, and clients then fetch every round.

    Member:
      type: object
      required: [account_id, email, role, status, enc_public_key, sign_public_key, joined_at]
      properties:
        account_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        enc_public_key: { $ref: '#/components/schemas/B64' }
        sign_public_key: { $ref: '#/components/schemas/B64' }
        member_cert: { $ref: '#/components/schemas/Signed' }
        admin_cert: { $ref: '#/components/schemas/Signed' }
        joined_at: { type: string, format: date-time }
        pending_vaults:
          type: array
          description: For an accepted member, the vault access their invite grants (the confirming app seals those keys).
          items: { $ref: '#/components/schemas/VaultGrant' }

    VaultGrant:
      type: object
      required: [vault_id, permission]
      properties:
        vault_id: { $ref: '#/components/schemas/Ulid' }
        permission: { $ref: '#/components/schemas/Permission' }

    CreateInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { enum: [member, admin] }
        vaults:
          type: array
          description: Access the member gets when an admin confirms them.
          items: { $ref: '#/components/schemas/VaultGrant' }

    Invite:
      type: object
      required: [id, org_id, email, role, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        org_id: { $ref: '#/components/schemas/Ulid' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        vaults:
          type: array
          items: { $ref: '#/components/schemas/VaultGrant' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: Only in the creating response, and only when the server doesn't mail invites.

    InviteInfo:
      type: object
      required: [org_id, org_name, email, role, inviter_email, owner_chain, expires_at]
      properties:
        org_id: { $ref: '#/components/schemas/Ulid' }
        org_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        inviter_email: { type: string, format: email }
        owner_chain:
          type: array
          items: { $ref: '#/components/schemas/OwnerLink' }
        expires_at: { type: string, format: date-time }

    SealedFor:
      type: object
      description: A vault key sealed to `account_id`, with the caller's grant signature.
      required: [account_id, wrapped_vault_key, grant_sig]
      properties:
        account_id: { type: string }
        wrapped_vault_key: { $ref: '#/components/schemas/B64' }
        grant_sig: { $ref: '#/components/schemas/B64' }

    MemberVaultKey:
      type: object
      required: [vault_id, key_id, wrapped_vault_key, grant_sig]
      properties:
        vault_id: { $ref: '#/components/schemas/Ulid' }
        key_id: { $ref: '#/components/schemas/B64' }
        wrapped_vault_key: { $ref: '#/components/schemas/B64' }
        grant_sig: { $ref: '#/components/schemas/B64' }

    GrantKey:
      type: object
      required: [key_id, wrapped_vault_key, grant_sig]
      properties:
        key_id: { $ref: '#/components/schemas/B64' }
        wrapped_vault_key: { $ref: '#/components/schemas/B64' }
        grant_sig: { $ref: '#/components/schemas/B64' }

    KeyGeneration:
      type: object
      required: [key_id, wrapped_vault_key, created_at]
      properties:
        key_id: { $ref: '#/components/schemas/B64' }
        wrapped_vault_key: { $ref: '#/components/schemas/B64' }
        grant:
          $ref: '#/components/schemas/Signed'
          description: Who sealed it (absent for a personal vault's own key). Apps verify it before use.
        created_at: { type: string, format: date-time }

    ConfirmMember:
      type: object
      required: [member_cert]
      properties:
        member_cert: { $ref: '#/components/schemas/B64' }
        admin_cert:
          $ref: '#/components/schemas/B64'
          description: Required when the member's role is admin.
        vault_keys:
          type: array
          items: { $ref: '#/components/schemas/MemberVaultKey' }

    UpdateMember:
      type: object
      required: [role]
      properties:
        role: { enum: [member, admin] }
        admin_cert: { $ref: '#/components/schemas/B64' }
        vault_keys:
          type: array
          items: { $ref: '#/components/schemas/MemberVaultKey' }

    TransferOrg:
      type: object
      required: [account_id, auth_key, owner_cert]
      properties:
        account_id: { type: string }
        auth_key: { $ref: '#/components/schemas/B64' }
        owner_cert: { $ref: '#/components/schemas/B64' }

    VaultMember:
      type: object
      required: [account_id, permission]
      properties:
        account_id: { type: string }
        permission: { $ref: '#/components/schemas/Permission' }
        implicit:
          type: boolean
          description: Owners and admins, whose access comes with the role.

    SetVaultMember:
      type: object
      required: [permission]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/GrantKey' }

    RotateVaultKey:
      type: object
      required: [key_id, previous_key_id, wrapped]
      properties:
        key_id: { $ref: '#/components/schemas/B64' }
        previous_key_id: { $ref: '#/components/schemas/B64' }
        wrapped:
          type: array
          items: { $ref: '#/components/schemas/SealedFor' }

    OrgEvent:
      type: object
      required: [seq, at, kind]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        kind:
          type: string
          examples: [org_created, org_updated, member_invited, invite_cancelled, member_accepted, member_confirmed, role_changed,
                     member_removed, member_left, ownership_transferred, vault_created, vault_deleted, vault_access_granted,
                     vault_access_changed, vault_access_revoked, vault_key_rotated, member_recertified, device_approval_requested, device_approved,
                     device_denied, audit_stream_configured, audit_stream_secret_rotated, audit_stream_removed, audit_stream_disabled]
        actor_id: { type: string }
        target_id: { type: string }
        vault_id: { $ref: '#/components/schemas/Ulid' }
        detail: { type: string }

    EventPage:
      type: object
      required: [events, has_more]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/OrgEvent' }
        has_more: { type: boolean }
