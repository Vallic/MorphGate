# Dependency updates as pull requests into develop, grouped so a week brings a few pull requests
# rather than dozens (each runs the full CI). Security fixes come as soon as GitHub knows of them,
# whatever this schedule says.
#
# Tauri is left out on both sides: its Rust crates and its npm packages must be on the same
# version (`tauri build` refuses a mismatch), so they're updated by hand, together.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "tauri*"
      # Pinned: tauri-plugin-deep-link doesn't build with 0.21.3 (new fields in ParseOption).
      - dependency-name: rust-ini
      # 6 has no blocking API, which mg-presence's polkit code uses: a port, not a bump.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
    groups:
      crates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/desktop
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@tauri-apps/*"
      # Node's types follow the Node the project runs on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      # v1 points latest.json at GitHub's API (anonymous downloads limited per address) and
      # renames inputs: a deliberate move, not a bump.
      - dependency-name: tauri-apps/tauri-action
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
