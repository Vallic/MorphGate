name: Prepare the runner
description: >
  Room on the runner's disk: removes what GitHub's image has and these jobs don't use (.NET, the
  Android SDK, Haskell, CodeQL).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
