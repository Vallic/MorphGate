[package]
name = "mg-vault"
description = "MorphGate vault crypto: key hierarchy and item envelopes (vault-sync/v1)"
license = "Apache-2.0 OR MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.1", features = ["derive"] }

